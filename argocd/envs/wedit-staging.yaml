apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wedit-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wedit-official/wedit-manifest.git
    targetRevision: main   # 추후 devlop 브랜치로 전환 가능
    path: staging
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
