apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wedit-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wedit-official/wedit-manifest.git
    targetRevision: main
    path: production
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
