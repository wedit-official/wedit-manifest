apiVersion: apps/v1
kind: Deployment
metadata:
  name: wedit-production
  namespace: wedit-production
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: wedit-production
  template:
    metadata:
      labels:
        app: wedit-production
    spec:
      containers:
        - name: wedit
          image: wien0128/wedit-be:27fbca1
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: production
